#cloud-config
# First boot only: base packages. Everything sandbox-specific is done by
# droplet/setup-droplet.sh, which Terraform runs over SSH once the secrets are uploaded.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - unzip
  - python3
  - python3-venv
  - ninja-build
  - unattended-upgrades
